version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: leyde
      POSTGRES_USER: leyde
      POSTGRES_PASSWORD: leyde
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/leyde
      - SPRING_DATASOURCE_USERNAME=leyde
      - SPRING_DATASOURCE_PASSWORD=leyde
    depends_on:
      - db
    ports:
      - "8080:8080"

volumes:
  db-data:
