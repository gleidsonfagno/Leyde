spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# Server
server:
  port: ${SERVER_PORT:8080}

# Logging
logging:
  level:
    root: INFO

# Datasource (override with environment variables per environment)
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/leyde}
    username: ${SPRING_DATASOURCE_USERNAME:leyde}
    password: ${SPRING_DATASOURCE_PASSWORD:leyde}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

# Flyway
flyway:
  enabled: true
  locations: classpath:db/migration

# Actuator and metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

# Application name
spring:
  application:
    name: leyde-backend

# Security defaults
security:
  jwt:
    secret: change-me-please-change-to-secure-long-key
    expiration-ms: 900000 # 15 minutes
    refresh-expiration-ms: 2592000000 # 30 days
  cors:
    allowed-origins: http://localhost:3000,https://localhost:3000

# Rate limit defaults (requests per minute)
ratelimit:
  public-endpoints:
    ip-requests-per-minute: 2000
    user-requests-per-minute: 2000
  admin-endpoints:
    ip-requests-per-minute: 60
    user-requests-per-minute: 30

# Redis connection (for cache)
spring:
  redis:
    host: localhost
    port: 6379

# Cache TTL default
cache:
  default-ttl-seconds: 300

# Response compression
server:
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/xml,text/plain,application/json,application/javascript,text/css

# Request logging
logging:
  level:
    com.leyde.backend.api.filter.RequestLoggingFilter: INFO
